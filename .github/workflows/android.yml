
name: Build Prosa APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repositoryw
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q Prosa-APK-pelo-celular.zip -d source

      
      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: gradlew não encontrado no ZIP"
            find source -maxdepth 5 -type f
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prosa-APK
          path: source/ProsaAndroid/**/build/outputs/apk/debug/*.apk
          
